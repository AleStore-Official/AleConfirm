<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email Confirmation - AleStore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <h2>Verifying your email...</h2>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js';
    const supabase = createClient(
      'https://hsyyrcbibohwvbuwxwok.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzeXlyY2JpYm9od3ZidXd4d29rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwNjE0MDcsImV4cCI6MjA3NjYzNzQwN30.2KsFsGYjwf_cA7Z9oglVthiaE1_jWYuQ6HMMm5UXsyo'
    );

    const pending = JSON.parse(localStorage.getItem("pending_user") || "{}");

    if (!pending.email || !pending.password || !pending.firstName || !pending.lastName) {
      window.location.href = "https://alestore-official.github.io/AleRegister";
    }

    (async () => {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: pending.email,
        password: pending.password
      });

      if (error || !data.user.email_confirmed_at) {
        window.location.href = "https://alestore-official.github.io/AleRegister";
        return;
      }

      const { error: insertError } = await supabase
        .from("utenti")
        .insert([{ email: pending.email, firstName: pending.firstName, lastName: pending.lastName }]);

      if (!insertError) {
        localStorage.setItem("user_verified", "true");
        localStorage.removeItem("pending_user");
        const origin = localStorage.getItem("origin_page") || "https://alestore-official.github.io/AleLogin";
        window.location.href = origin;
      } else {
        window.location.href = "https://alestore-official.github.io/AleRegister";
      }
    })();
  </script>
</body>
</html>
