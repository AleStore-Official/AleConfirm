<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email Confirmation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
    }

    .glass-box {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    h2 {
      margin-bottom: 20px;
      color: #222;
      font-size: 24px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);
      animation: pulse 2s infinite;
    }

    p {
      font-size: 16px;
      color: #333;
    }

    .error {
      color: #d9534f;
      font-weight: bold;
      margin-top: 10px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="glass-box">
    <h2>✅ Email Confirmed</h2>
    <p id="message">Redirecting to login...</p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js';
    const supabase = createClient(
      'https://hsyyrcbibohwvbuwxwok.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    );

    const { data: { user } } = await supabase.auth.getUser();
    const message = document.getElementById("message");

    if (user?.email_confirmed_at) {
      const pending = JSON.parse(localStorage.getItem("pending_user"));
      if (pending && pending.email === user.email) {
        const { error } = await supabase.from("utenti").insert({
          first_name: pending.firstName,
          last_name: pending.lastName,
          email: user.email,
          password: pending.password
        });
        if (!error) {
          localStorage.setItem("user_verified", "true");
          localStorage.removeItem("pending_user");
        } else {
          console.error("Insert error:", error.message);
          message.innerHTML = `<span class="error">⚠️ Account already exists. Redirecting to login...</span>`;
        }
      }
    }

    setTimeout(() => {
      window.location.href = "https://alestore-official.github.io/AleLogin";
    }, 2000);
  </script>
</body>
</html>
